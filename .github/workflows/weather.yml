name: Update Weather Data
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Open-Meteo
        run: |
          curl -s "https://api.open-meteo.com/v1/forecast?latitude=41.1171&longitude=16.8719&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=Europe%2FRome&forecast_days=5" -o weather.json
          echo -n "window.METEO_DATA = " > weather.js
          cat weather.json >> weather.js
          echo ";" >> weather.js
      - name: Commit and push
        run: |
          git config --global user.name "WeatherBot"
          git config --global user.email "bot@github.com"
          git add weather.json weather.js
          git commit -m "Allineamento dati meteo" || exit 0
          git push
